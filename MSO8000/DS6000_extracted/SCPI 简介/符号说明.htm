<title>符号说明</title>
</head>

<body>

<p style="margin-top: 0; margin-bottom: 0">
<span style="font-weight: 700"><font face="黑体" size="4">符号说明</font></span></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p class="MsoNormal" style="margin-top: 0; margin-bottom: 0"><b>
<span lang="PT-BR" style="font-family: Tahoma,sans-serif"><font size="2">1.</font><span style="font-style: normal; font-variant: normal; font-weight: normal; font-family: Times New Roman"><font size="2">&nbsp;&nbsp;&nbsp;&nbsp;
</font></span></span><span style="font-family: 宋体"><font size="2">大括号</font></span><span lang="PT-BR"><font size="2"> 
{ &nbsp;}</font></span></b></p>
<p class="MsoNormal" align="left" style="text-align: left; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<span style="font-family: 宋体"><font size="2">大括号中的内容为参数选项。参数项之间通常用竖线“</font></span><font size="2"><span lang="PT-BR" style="font-family: Tahoma,sans-serif">|</span></font><span style="font-family: 宋体"><font size="2">”分隔。使用命令时，必须选择其中一个参数。</font></span></p>
<p class="MsoNormal" align="left" style="text-align: left; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<b><span lang="PT-BR" style="color: black"><font size="2">&nbsp;</font></span></b></p>
<p class="MsoNormal" align="left" style="text-align: left; text-indent: -21.0pt; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<b><span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">2.</font><span style="font-style: normal; font-variant: normal; font-weight: normal; font-family: Times New Roman"><font size="2">&nbsp;&nbsp;&nbsp;&nbsp;
</font></span></span><span style="font-family: 宋体; color: black"><font size="2">
竖线</font></span><font size="2"><span style="color: black"> </span></font>
<span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">|</font></span></b></p>
<p class="MsoNormal" align="left" style="text-align: left; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<span style="font-family: 宋体; color: black"><font size="2">竖线用于分隔多个参数选项</font></span><span style="font-family: 宋体"><font size="2">，使用命令时，必须选择其中一个参数。</font></span></p>
<p class="MsoNormal" align="left" style="text-align: left; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">&nbsp;</font></span></p>
<p class="MsoNormal" align="left" style="text-align: left; text-indent: -21.0pt; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<b><span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">3.</font><span style="font-style: normal; font-variant: normal; font-weight: normal; font-family: Times New Roman"><font size="2">&nbsp;&nbsp;&nbsp;&nbsp;
</font></span></span><span style="font-family: 宋体; color: black"><font size="2">
方括号</font></span><span style="color: black"><font size="2"> </font>
<span lang="PT-BR"><font size="2">[ &nbsp;]</font></span></span></b></p>
<p class="MsoNormal" style="margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<span style="font-family: 宋体; color: black"><font size="2">方括号中的内容是可省略的。</font></span></p>
<p class="MsoNormal" style="margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<span lang="EN-US" style="font-family: Tahoma,sans-serif"><font size="2">&nbsp;</font></span></p>
<p class="MsoNormal" align="left" style="text-align: left; text-indent: -21.0pt; margin-left: 21.0pt; margin-top: 0; margin-bottom: 0">
<b><span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">4.</font><span style="font-style: normal; font-variant: normal; font-weight: normal; font-family: Times New Roman"><font size="2">&nbsp;&nbsp;&nbsp;&nbsp;
</font></span></span><span style="font-family: 宋体; color: black"><font size="2">
三角括号</font></span><font size="2"><span style="color: black"> </span></font>
<span lang="EN-US" style="font-family: 宋体; color: black"><font size="2">&lt; &nbsp;&gt;</font></span></b></p>
<p style="margin-left: 21.0pt; margin-top: 0; margin-bottom: 0" class="MsoNormal">
<span style="font-family: 宋体; color: black"><font size="2">三角括号中的参数必须用一个有效值来替换。</font></span></p>

</body>
