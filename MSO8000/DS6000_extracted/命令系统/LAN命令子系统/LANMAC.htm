<p style="margin-top: 0px; margin-bottom: 0px"><span style="font-weight: 700">
<font face="Tahoma" size="4">:LAN:MAC?</font></span></p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px"><font size="2" face="宋体"><b>命令格式</b></font></p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0; margin-bottom: 0"><font size="2" face="Tahoma">:LAN:MAC?</font></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0"><font size="2" face="宋体"><b>功能描述</b></font></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0"><font size="2" face="宋体">
查询仪器</font><font size="2" face="Tahoma">MAC</font><font size="2" face="宋体">地址。
示波器中显示的地址格式：</font><font size="2" face="Tahoma">00-19-AF-30-00-00</font></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0"><font size="2" face="宋体"><br>
<b>返回格式</b></font></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0"><font size="2" face="宋体">
查询以字符串形式返回</font><font size="2" face="Tahoma">MAC</font><font size="2" face="宋体">地址值
。例如：</font><font size="2" face="Tahoma">0019af300000</font></p>
