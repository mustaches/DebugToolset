<title>:SINGle</title>
</head>

<body>

<p style="margin-top: 0px; margin-bottom: 0px"><font size="4" face="Tahoma">
<span style="font-weight: 700">:SINGle</span></font></p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px"><font size="2" face="宋体"><b>命令格式</b></font></p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px">
<span lang="PT-BR" style="font-family: Tahoma; color: black">
<font size="2">:SINGle</font></span></p>
<p style="margin-top: 0px; margin-bottom: 0px"><font face="宋体" size="2"><br>
　</font></p>
<p style="margin-top: 0px; margin-bottom: 0px"><font size="2" face="宋体"><b>功能描述</b></font></p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px">
<span lang="PT-BR" style="font-family: 宋体; color: black">
<font size="2">将示波器设置为单次触发方式。</font></span></p>
<p style="margin-top: 0px; margin-bottom: 0px">
　</p>
<p style="margin-top: 0px; margin-bottom: 0px">
　</p>
<p style="margin-top: 0px; margin-bottom: 0px"><font size="2" face="宋体"><b>说明</b></font></p>
<p style="margin-top: 0px; margin-bottom: 0px">　</p>
<p style="margin-top: 0px; margin-bottom: 0px"><span style="font-family: 宋体">
<font size="2">单次触发方式下，示波器将在符合触发条件下进行一次触发，然后停止。</font></span></p>
<p style="margin-top: 0px; margin-bottom: 0px"><font size="2">
<span lang="PT-BR" style="font-family: 宋体; color: black">单次触发时，使用</span><font color="#0000FF"><span lang="PT-BR" style="font-family: Tahoma; text-decoration:underline"><a href="TFORce.htm">:TFORce</a></span></font><span lang="PT-BR" style="font-family: 宋体; color: black">命令强制产生一个触发信号。<br>
您可以使用</span><font color="#0000FF" size="2"><a href="RUN.htm"><span style="font-family: Tahoma; text-decoration:underline">:RUN</span></a></font><span lang="PT-BR" style="font-family: 宋体; color: black">或</span><font color="#0000FF" size="2"><span style="font-family: Tahoma; text-decoration:underline"><a href="STOP.htm">:STOP</a></span></font><span lang="PT-BR" style="font-family: 宋体; color: black">命令将示波器分别设为自动触发方式或停止状态。</span></font></p>

</body>
