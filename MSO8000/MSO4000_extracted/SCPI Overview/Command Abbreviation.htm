<title>命令缩写</title>
</head>

<body>

<p style="margin-top: 0; margin-bottom: 0">
<span style="font-weight: 700"><font face="黑体" size="4">命令缩写</font></span></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p class="MsoNormal" style="margin-top: 0; margin-bottom: 0">
<span style="font-family: 宋体"><font size="2">
所有命令对大小写不敏感，你可以全部采用大写或小写。但是如果要缩写，必须输完命令格式中的所有大写字母，例如：</font></span></p>
<p class="MsoNormal" align="left" style="text-align: left; margin-top: 0; margin-bottom: 0">
<span lang="PT-BR"><font size="2">&nbsp;</font></span></p>
<p style="margin-top: 0; margin-bottom: 0">
<span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">:MEASure:ADISplay?</font></span><span lang="PT-BR" style="font-family: Tahoma,sans-serif"><font size="2">
</font></span><span lang="EN-US" style="font-family: Tahoma,sans-serif">
<font size="2">&nbsp;&nbsp;&nbsp;</font></span></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0"><span style="font-family: 宋体">
<font size="2">可缩写成：</font></span><span lang="EN-US" style="font-family: Tahoma,sans-serif"><font size="2">&nbsp;</font></span></p>
<p style="margin-top: 0; margin-bottom: 0">　</p>
<p style="margin-top: 0; margin-bottom: 0">
<span lang="PT-BR" style="font-family: Tahoma,sans-serif; color: black">
<font size="2">:MEAS:ADIS?</font></span></p>

</body>
